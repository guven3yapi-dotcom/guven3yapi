<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Güven 3 yapı Dekorasyon | Social Links</title>

<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#222;
    display:flex;
    justify-content:center;
    padding:0 16px 28px;
  }

  .page{
    width:100%;
    max-width:480px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  /* Decorative lines similar to the reference */
  .decor{
    height:105px;
    position:relative;
    overflow:hidden;
  }
  .decor:before,.decor:after{
    content:"";
    position:absolute;
    width:135px;
    height:80px;
    top:0;
    opacity:.28;
    background:repeating-linear-gradient(
      100deg,
      transparent 0 10px,
      #7b7b7b 11px 12px
    );
  }
  .decor:before{left:-25px;transform:rotate(-3deg)}
  .decor:after{right:-25px;transform:rotate(8deg)}

  .profile{
    margin-top:-55px;
    position:relative;
    z-index:2;
  }

  .avatar{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:8px solid #fff;
    box-shadow:0 1px 7px rgba(0,0,0,.08);
    background:#eee;
  }

  h1{
    margin:13px 0 7px;
    font-size:27px;
    font-weight:500;
    letter-spacing:-.4px;
  }

  .role{
    margin:0;
    color:#888;
    font-size:18px;
    line-height:1.35;
  }
  .role strong{color:#555;font-weight:600}

  .subtitle{
    margin:18px 0 20px;
    color:#8a8a8a;
    font-size:17px;
  }

  .quick{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:27px;
  }

  .quick a{
    width:68px;
    height:68px;
    border:1px solid #d6d6d6;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#111;
    transition:.2s;
    background:#fff;
  }
  .quick a:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.08)}
  .quick svg{width:29px;height:29px}

  .connect{
    display:flex;
    align-items:center;
    justify-content:center;
    height:70px;
    border-radius:40px;
    background:#000;
    color:#fff;
    text-decoration:none;
    font-size:20px;
    font-weight:600;
    margin:0 0 20px;
    transition:.2s;
  }
  .connect:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.16)}

  .social-box{
    background:#f1f1f3;
    border-radius:30px 30px 0 0;
    padding:38px 20px 32px;
    min-height:360px;
  }

  .social-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:31px 15px;
    align-items:start;
  }

  .social{
    color:#666;
    text-decoration:none;
    font-size:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
  }

  .icon{
    width:95px;
    height:95px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .icon svg{width:55px;height:55px}
  .instagram{background:linear-gradient(135deg,#6b2aa6,#e66b36,#f3c74e)}
  .whatsapp{background:#43c95a}
  .tiktok{background:#000}

  .edit-note{
    margin-top:20px;
    color:#aaa;
    font-size:12px;
  }

  @media(max-width:390px){
    h1{font-size:24px}
    .avatar{width:125px;height:125px}
    .icon{width:82px;height:82px}
    .icon svg{width:47px;height:47px}
    .social{font-size:14px}
  }
</style>
</head>
